name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build pip-audit ruff
      - run: python -m pip install -e .
      - run: python -m ruff check src tests
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: python -m pip check
      - run: python -m pip_audit
      - run: fallbacklens benchmark benchmarks/policy-cases-v1.json --json artifacts/benchmark.json --svg artifacts/policy-benchmark.svg
      - run: fallbacklens audit examples/litellm-safe.yaml --profile examples/profile-safe.json --json artifacts/safe-audit.json --html artifacts/safe-audit.html --svg artifacts/safe-graph.svg
      - run: fallbacklens simulate examples/litellm-safe.yaml --scenarios examples/scenarios.json --json artifacts/scenario-replay.json
      - run: python -m build
